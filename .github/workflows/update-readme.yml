name: Update README activity

on:
  workflow_dispatch:        # manual trigger only (schedule skipped, as in the lecture)

permissions:
  contents: read            # built-in GITHUB_TOKEN is read-only; the action writes using REPO_TOKEN

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GitHub Activity
        uses: TheDanniCraft/activity-log@v1
        with:
          GITHUB_USERNAME: "DanielSkarstein"
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
